kind = "web"
previewPath = "/"
title = "SpecForge"
description = "An academic course specification validator that extracts syllabus and outcomes, checks inconsistencies, proposes evidence-grounded CO–PO–PSO mappings, and prepares reviewable draft corrections."
version = "1.0.0"
id = "artifacts/specforge"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 26218

[services.development]
run = "pnpm --filter @workspace/specforge run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/specforge", "run", "build" ]
serve = "static"
publicDir = "artifacts/specforge/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "26218"
BASE_PATH = "/"
